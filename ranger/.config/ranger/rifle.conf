# rifle.conf additions (optional): prefer bat for previews where possible
# You can keep your existing rifle.conf; this is a minimal, safe default.

# Preview text files with bat if installed
mime ^text,  label preview, has bat,  pager  = bat --style=numbers --color=always --paging=never --wrap=never -- "$1"
mime ^text,  label pager,   !has bat, pager  = less -R -- "$1"

# Images: just open with default viewer (adjust if needed)
mime ^image, label open,  has chafa, terminal, X, flag f = chafa --view-size=80x40 --stretch --animate --format symbols --loops=1 --clear -- "$1"

# Fallback
# Quote path to handle spaces and parentheses
mime .* = xdg-open "$1"