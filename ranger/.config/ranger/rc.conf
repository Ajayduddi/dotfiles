# Ranger configuration additions for fzf and zoxide integration
# This file is managed in dotfiles for stow.

# Keybindings:
#   z  i  -> zoxide interactive jump
#   f     -> fzf select (files or directories)
#   F     -> fzf directory-only select
#   <C-f> -> :fzf (same as `f`)

# UI: keep borders (fzf has its own borders too)
set draw_borders false

# Use custom preview script (tmux-friendly, chafa-based)
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh
set preview_files true
# Limit preview size to 100MB to avoid errors on some ranger versions
set preview_max_size 104857600

# Map keys to our custom commands (defined in commands.py)
map zi zoxide_cd
map f  fzf_select
map F  fzf_search_dir
map <C-f> fzf_select
# Open with system default app (GUI) using xdg-open
map o shell xdg-open "%s" >/dev/null 2>&1 &
# Make Enter open files with default app, and enter directories normally
map <enter> open_default