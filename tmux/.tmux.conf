unbind r
# Add binding to reload tmux.conf for fast, iterative development
bind r source-file ~/.tmux.conf \; display "Reloaded!"


set -g prefix C-w
set -g mouse on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -g base-index 1

# Enable image protocol passthrough for kitty/wezterm (tmux >= 3.3)
if -F '#{>=:#{version},3.3}' 'set -g allow-passthrough on'

# Ensure truecolor (24-bit) is detected in common terminals
if -F '#{>=:#{version},3.2}' 'set -as terminal-features "xterm-kitty:RGB,alacritty:RGB,xterm-256color:RGB,screen-256color:RGB"'
# Backward compatibility for older tmux versions
set -ga terminal-overrides ",xterm-256color:RGB,screen-256color:RGB,alacritty:RGB,kitty:RGB"

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Catppuccin plugin is loaded by TPM (managed via @plugin entries above)

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"


# Splits
bind v split-window -h    # vertical divider (side-by-side)
bind h split-window -v    # horizontal divider (stacked)

# Window/pane switching
bind -n M-= next-window           # Alt+= cycles to next window
bind -n M-- select-pane -t :.+    # Alt+- cycles panes
bind -n M-s choose-tree -s        # Alt+s session switcher

# Copy in copy-mode with Ctrl+k (clipboard-aware)
# Prefer available system clipboard utilities: xsel, xclip, wl-copy, pbcopy (in that order)
# The final bind (fallback) will be applied last — ordering ensures the preferred provider
# (pbcopy on mac, wl-copy on Wayland, xclip/xsel on X11) will win when present.

if-shell 'command -v xsel >/dev/null 2>&1' \
  'bind -T copy-mode-vi C-k send -X copy-pipe-and-cancel "xsel --input --clipboard" \; bind -T copy-mode C-k send -X copy-pipe-and-cancel "xsel --input --clipboard"' \
  ''
if-shell 'command -v xclip >/dev/null 2>&1' \
  'bind -T copy-mode-vi C-k send -X copy-pipe-and-cancel "xclip -in -selection clipboard" \; bind -T copy-mode C-k send -X copy-pipe-and-cancel "xclip -in -selection clipboard"' \
  ''
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'bind -T copy-mode-vi C-k send -X copy-pipe-and-cancel "wl-copy" \; bind -T copy-mode C-k send -X copy-pipe-and-cancel "wl-copy"' \
  ''
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind -T copy-mode-vi C-k send -X copy-pipe-and-cancel "pbcopy" \; bind -T copy-mode C-k send -X copy-pipe-and-cancel "pbcopy"' \
  ''
# Fallback: copy into tmux buffer but do not attempt to pipe to an external clipboard tool
bind -T copy-mode-vi C-k send -X copy-selection-and-cancel
bind -T copy-mode C-k send -X copy-selection-and-cancel

# Mouse: behave like a modern terminal
# - Wheel scroll enters copy-mode and scrolls history
# - Drag selects; release copies to clipboard (when xclip exists)
# - Shift+mouse selection bypasses tmux (handled by the terminal)
bind -n WheelUpPane if -F '#{pane_in_mode}' 'send -X scroll-up' 'copy-mode -e; send -X scroll-up'
bind -n WheelDownPane if -F '#{pane_in_mode}' 'send -X scroll-down' 'send -X scroll-down'

# Copy on mouse release if available
if-shell 'command -v xsel >/dev/null 2>&1' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel --input --clipboard"' \
  ''
if-shell 'command -v xclip >/dev/null 2>&1' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"' \
  ''
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"' \
  ''
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"' \
  ''
# Fallback if none of the system clipboard utilities are present
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

